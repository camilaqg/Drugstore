<div class="container">

    <!-- lado izquierdo: marca -->
    <div class="left">
        <div class="card" data-reveal="settle">

            <div class="logo">
                <img src="iconos/flor.png" alt="flor" decoding="async">
            </div>

            <h2>Drogueria Pili</h2>
            <p>SISTEMA DE GESTION</p>
        </div>
    </div>

    <!-- lado derecho: registro -->
    <div class="right">
        <div class="register-box" data-reveal="settle" style="--i: 1">
            <h1>Crear cuenta</h1>

            <form (ngSubmit)="register()">

                <!-- NOMBRE -->
                <div class="field">
                    <label>Nombre completo</label>
                    <input
                        type="text"
                        [ngModel]="name()"
                        (ngModelChange)="name.set($event)"
                        name="name"
                        placeholder="Ingrese su nombre"
                        required>
                </div>

                <!-- CORREO -->
                <div class="field">
                    <label>Correo</label>
                    <input
                        type="email"
                        [ngModel]="email()"
                        (ngModelChange)="email.set($event)"
                        name="email"
                        placeholder="Ingrese su correo"
                        required>
                </div>

                <!-- USUARIO -->
                <div class="field">
                    <label>Usuario</label>
                    <input
                        type="text"
                        [ngModel]="username()"
                        (ngModelChange)="username.set($event)"
                        name="username"
                        placeholder="Ingrese su usuario"
                        required>
                </div>

                <!-- CONTRASEÑA -->
                <div class="field">
                    <label>Contraseña</label>
                    <input
                        type="password"
                        [ngModel]="password()"
                        (ngModelChange)="password.set($event)"
                        name="password"
                        placeholder="Ingrese su contraseña"
                        required>

                    <!-- VALIDACION PARA LOS CARACTERES -->
                    @if (password().length < 8 && password()) {
                        <p class="form-error">*Mínimo 8 caracteres*</p>
                    }
                </div>

                <!-- CONFIRMAR CONTRASEÑA -->
                <div class="field">
                    <label>Confirmar contraseña</label>
                    <input
                        type="password"
                        [ngModel]="confirmPassword()"
                        (ngModelChange)="confirmPassword.set($event)"
                        name="confirmPassword"
                        placeholder="Repita su contraseña"
                        required>

                    <!-- VALIDACIÓN COINCIDENCIA EN LAS CONTRASEÑAS -->
                    @if (password() !== confirmPassword() && confirmPassword()) {
                        <p class="form-error">*Las contraseñas no coinciden*</p>
                    }
                </div>

                <!-- BOTÓN -->
                <button type="submit">Registrarse</button>

            </form>

        </div>
    </div>

</div>
