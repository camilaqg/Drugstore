<div class="container">

  <!-- lado izquierdo: marca -->
  <div class="left">
    <div class="card" data-reveal="settle">

      <div class="logo">
        <img src="iconos/flor.png" alt="flor" decoding="async">
      </div>

      <!-- nombre -->
      <h1>Drogueria Pili</h1>
      <p>SISTEMA DE GESTION</p>

    </div>
  </div>

  <!-- lado derecho: login -->
  <div class="right">
    <div class="login-box" data-reveal="settle" style="--i: 1">

      <h2>Ingresar al sistema</h2>

      <!-- form login -->
      <form (ngSubmit)="login()">

        <!-- usuario -->
        <div class="field">
          <label>Usuario</label>

          <input
            type="text"
            [ngModel]="username()"
            (ngModelChange)="username.set($event)"
            name="username"
            placeholder="Ingrese su usuario"
            required
          />
        </div>

        <!-- contraseña -->
        <div class="field">
          <label>Contraseña</label>

          <input
            type="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            placeholder="Ingrese su contraseña"
            required
          />

          @if (errorCampos()) {
            <p class="form-error">*Campos obligatorios*</p>
          }

          @if (errorCredenciales()) {
            <p class="form-error">*Usuario o contraseña incorrectos*</p>
          }

          @if (errorServidor()) {
            <p class="form-error">
              *Error de conexión con el servidor. Intentá de nuevo más tarde.*
            </p>
          }

        </div>

        <!-- boton -->
        <button type="submit">Ingresar</button>

        <!-- registro -->
        <p class="form-alt">
          ¿No tienes cuenta?
          <a routerLink="/register">Regístrate</a>
        </p>

      </form>

    </div>
  </div>

</div>
