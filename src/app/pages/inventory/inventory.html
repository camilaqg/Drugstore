<!-- Contenedor principal del módulo de inventario -->
<div class="inventory-container">

  <!-- Encabezado de la página -->
  <div class="header-seccion">

    
    <h2>Gestion de Inventario</h2>

    <!-- Tarjeta que contiene el formulario de medicamentos -->
    <section class="tarjeta-blanca">

      <!-- Título de la sección -->
      <p class="titulo-gris">DATOS DEL MEDICAMENTO</p>

      <!-- Formulario organizado en forma de cuadrícula -->
      <div class="grid-formulario">

        <!-- Selección del código del medicamento -->
        <div class="campo">
          <label>ID / CODIGO</label>

          <select [(ngModel)]="newMedicine.id" class="form-select">
            <option *ngFor="let m of listaMeds" [value]="m.id">
              {{ m.id }}
            </option>
          </select>
        </div>

        <!-- Campo para registrar el nombre comercial -->
        <div class="campo grande">
          <label>NOMBRE COMERCIAL</label>
          <input type="text" [(ngModel)]="newMedicine.name">
        </div>

        <!-- Campo para registrar el laboratorio fabricante -->
        <div class="campo">
          <label>LABORATORIO</label>
          <input type="text" [(ngModel)]="newMedicine.laboratory">
        </div>

        <!-- Campo para describir el uso del medicamento -->
        <div class="campo grande">
          <label>PARA QUE SIRVE (DESCRIPCION)</label>
          <input type="text" [(ngModel)]="newMedicine.description">
        </div>

        <!-- Cantidad disponible inicialmente -->
        <div class="campo">
          <label>STOCK INICIAL</label>
          <input type="number" [(ngModel)]="newMedicine.stock">
        </div>

        <!-- Precio al que se compra el medicamento -->
        <div class="campo">
          <label>PRECIO COMPRA</label>
          <input
            type="number"
            min="0"
            [(ngModel)]="newMedicine.purchasePrice">
        </div>

        <!-- Precio al que se venderá el medicamento -->
        <div class="campo">
          <label>PRECIO VENTA</label>
          <input
            type="number"
            min="0"
            [(ngModel)]="newMedicine.salePrice">
        </div>

      </div>
    </section>

    <!-- Caja de búsqueda para filtrar medicamentos -->
    <div class="caja-busqueda">

      <input
        type="text"
        placeholder="Filtrar por nombre..."
        (input)="buscar($event)">

    </div>

  </div>

  <!-- Tarjeta que muestra el inventario actual -->
  <section class="tarjeta-blanca">

    <!-- Título de la tabla -->
    <p class="titulo-gris">INVENTARIO ACTUAL</p>

    <!-- Contenedor con desplazamiento para la tabla -->
    <div class="tabla-scroll">

      <table>

        <!-- Encabezados de la tabla -->
        <thead>
          <tr>
            <th>ID</th>
            <th>MEDICAMENTO</th>
            <th>LAB</th>
            <th>STOCK</th>
            <th>P. COMPRA</th>
            <th>P. VENTA</th>
            <th>ESTADO</th>
          </tr>
        </thead>

        <!-- Datos del inventario -->
        <tbody>

          <!-- Recorre la lista de medicamentos y muestra cada registro -->
          <tr
            *ngFor="let m of listaMeds"
            (click)="seleccionar(m)"
            style="cursor: pointer;">

            <td>{{ m.id }}</td>
            <td>{{ m.name }}</td>
            <td>{{ m.laboratory }}</td>
            <td>{{ m.stock }}</td>
            <td>{{ m.purchasePrice }}</td>
            <td>{{ m.salePrice }}</td>

            <!-- Estado actual del medicamento -->
            <td>
              <span
                class="etiqueta-estado"
                [attr.data-status]="m.status">

                {{ m.status }}

              </span>
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>

  <!-- Botones para realizar acciones sobre el inventario -->
  <div class="botones-abajo">

    <!-- Modificar un medicamento seleccionado -->
    <button
      class="btn btn-mod"
      (click)="actualizar()">
      Modificar
    </button>

    <!-- Eliminar un medicamento -->
    <button
      class="btn btn-del"
      (click)="borrar()">
      Eliminar
    </button>

    <!-- Registrar un nuevo medicamento -->
    <button
      class="btn btn-reg"
      (click)="registrar()">
      Registrar
    </button>

    <!-- Limpiar los campos del formulario -->
    <button
      class="btn btn-clear"
      (click)="limpiar()">
      Limpiar
    </button>

    <!-- Regresar al menú principal -->
    <button
      class="btn btn-exit"
      (click)="irAlMenu()">
      Salir
    </button>

  </div>

</div>
