<!-- Botón flotante que abre y cierra el chat -->
<button
  class="boton-chat"
  (click)="abierto = !abierto">

  <img src="iconos/chat bot.png" alt="chat bot">

</button>

<!-- Contenedor principal del chat -->
<div
  class="chat-container"
  *ngIf="abierto">

  <!-- Encabezado del chat -->
  <div class="chat-header">

    <!-- Título del asistente -->
    <h3>Asistente Virtual</h3>

    <!-- Botón para cerrar el chat -->
    <button
      (click)="abierto = false">
    </button>

  </div>

  <!-- Área donde se muestran los mensajes -->
  <div class="chat-body">

    <!-- Recorre y muestra todos los mensajes -->
    <div
      *ngFor="let m of mensajes"
      [ngClass]="m.bot ? 'mensaje-bot' : 'mensaje-user'">

      {{ m.texto }}

    </div>

  </div>

  <!-- Sección para escribir y enviar mensajes -->
  <div class="chat-footer">

    <!-- Campo de texto del usuario -->
    <input
      type="text"
      [(ngModel)]="mensaje"
      placeholder="Escribe un mensaje..."
      (keyup.enter)="enviarMensaje()">

    <!-- Botón para enviar el mensaje -->
    <button
      (click)="enviarMensaje()">

      Enviar

    </button>

  </div>

</div>
