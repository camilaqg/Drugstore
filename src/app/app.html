@if (mostrarLayout()) {

<header class="topbar" data-reveal="settle">

  <!-- marca -->
  <div class="brand">

    <div class="brand-mark">
      <img src="iconos/flor.png" alt="" decoding="async">
    </div>

    <div class="brand-text">
      <h1>Droguería Pili</h1>
      <span>Sistema de gestión</span>
    </div>

  </div>

  <!-- navegación -->
  <nav class="pills" aria-label="Secciones principales">

    @if (!esUsuario()) {
      <a routerLink="/inventory" routerLinkActive="activo">Inventario</a>
    }

    @if (!esUsuario()) {
      <a routerLink="/sales" routerLinkActive="activo">Ventas</a>
    }

    <a routerLink="/purchases" routerLinkActive="activo">Compras</a>

    @if (!esUsuario()) {
      <a routerLink="/usuarios" routerLinkActive="activo">Usuarios</a>
    }

    @if (!esUsuario()) {
      <a routerLink="/reports" routerLinkActive="activo">Informes</a>
    }

  </nav>

  <!-- cuenta -->
  <div class="account">

    <button class="who" type="button" (click)="irAlMenu()">
      <span class="dot" aria-hidden="true">{{ textoUsuario().charAt(0) }}</span>
      {{ textoUsuario() }}
    </button>

    <button class="signout" type="button" (click)="logout()">
      Salir
    </button>

  </div>

</header>

}

<!-- CONTENIDO -->
<main class="app-main">

  <router-outlet></router-outlet>

</main>

<!-- CHATBOT -->
<app-chatbot></app-chatbot>

<!-- FOOTER -->
@if (mostrarLayout()) {

<footer class="site-footer">
  <p>© 2026 Droguería Pili — Todos los derechos reservados</p>
</footer>

}
